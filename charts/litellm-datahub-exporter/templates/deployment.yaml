apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "exporter.name" . }}
  labels: {{- include "exporter.labels" . | nindent 4 }}
spec:
  # One exporter per LiteLLM deployment: proxy replicas share one Postgres,
  # so a single poller covers them all. Do not scale this up.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "exporter.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: LITELLM_BASE_URL
              value: {{ .Values.litellmBaseUrl | quote }}
            - name: STATE_FILE
              value: /state/state.json
            - name: METRICS_ADDR
              value: {{ .Values.metrics.enabled | ternary (printf ":%d" (int .Values.metrics.port)) "" | quote }}
            {{- range $key, $value := .Values.config }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "exporter.secretName" . }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
          {{- end }}
          volumeMounts:
            - name: state
              mountPath: /state
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "exporter.name" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
