{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "exporter.name" . }}
  labels: {{- include "exporter.labels" . | nindent 4 }}
stringData:
  LITELLM_API_KEY: {{ required "set litellmApiKey or existingSecret" .Values.litellmApiKey | quote }}
  DOIT_API_KEY: {{ required "set doitApiKey or existingSecret" .Values.doitApiKey | quote }}
{{- end }}
