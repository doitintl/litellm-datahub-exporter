# Required: your LiteLLM proxy URL (usually the in-cluster Service).
litellmBaseUrl: "http://litellm:4000"

# Required credentials. Either set them here (written into a chart-managed
# Secret) or leave both empty and point existingSecret at a Secret you manage
# with keys LITELLM_API_KEY and DOIT_API_KEY.
litellmApiKey: ""
doitApiKey: ""
existingSecret: ""

# Everything under config lands in the container environment verbatim.
# See the README configuration table for the full list and defaults.
config:
  DOIT_API_URL: "https://api.doit.com"
  DATASET: "LiteLLM"
  MODE: "per_call"
  POLL_INTERVAL: "5m"
  LOOKBACK_HOURS: "48"
  BACKFILL_DAYS: "0"
  # Set this when one shared virtual key fronts every caller and the person's
  # email is in end_user, which is what fills genai/user_email for the GenAI
  # dashboards. "end_user", "key_alias" or "none" (default). Read the README
  # section "Per-person email" before turning it on: the source is declared,
  # not detected, and a wrong address is worse than an absent one.
  # GENAI_USER_EMAIL_SOURCE: "end_user"

image:
  repository: ghcr.io/doitintl/litellm-datahub-exporter
  tag: ""          # defaults to the chart appVersion
  pullPolicy: IfNotPresent

# Checkpoint persistence. Losing it is safe (re-export is idempotent), so
# persistence is optional; emptyDir is used when disabled.
persistence:
  enabled: true
  size: 100Mi
  storageClassName: ""

metrics:
  enabled: true
  port: 9464

# Restrict egress to the LiteLLM proxy namespace + HTTPS (DoiT API + DNS).
# Adjust litellmSelector to match your proxy pods before enabling.
networkPolicy:
  enabled: false
  litellmSelector: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
