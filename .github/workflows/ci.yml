name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -trimpath ./cmd/exporter
  litellm-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        litellm: ["main-stable", "main-latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: integration test against LiteLLM ${{ matrix.litellm }}
        run: ./scripts/integration-test.sh ${{ matrix.litellm }}
