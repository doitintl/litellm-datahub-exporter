# Release pipeline. Everything a customer needs to trust the artifacts is
# produced here, in public CI, from the tag:
#   - static binaries (CGO_ENABLED=0, -trimpath) for linux/darwin x amd64/arm64,
#     with a sha256 checksum file signed by keyless cosign
#   - a multi-arch container on GHCR with BuildKit provenance and SBOM
#     attestations, signed by keyless cosign
# Verify (see README): cosign verify / cosign verify-blob against the
# GitHub Actions OIDC identity of this workflow.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write # keyless cosign (OIDC)

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: test
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              out="litellm-datahub-exporter_${VERSION}_${os}_${arch}"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
                -o "dist/${out}/litellm-datahub-exporter" ./cmd/exporter
              tar -C "dist/${out}" -czf "dist/${out}.tar.gz" litellm-datahub-exporter
              rm -r "dist/${out}"
            done
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - uses: sigstore/cosign-installer@v3

      - name: sign checksums
        run: |
          cosign sign-blob --yes \
            --bundle dist/checksums.txt.sigstore.json \
            dist/checksums.txt

      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt dist/checksums.txt.sigstore.json

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

      - name: sign image
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
